<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { background: #fff; border-radius: 8px; padding: 30px; max-width: 800px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #c0392b; font-size: 22px; margin-bottom: 5px; }
        .meta { color: #666; font-size: 13px; margin-bottom: 25px; }
        .error-card { border: 1px solid #e0e0e0; border-left: 5px solid #e74c3c; border-radius: 6px; padding: 15px 20px; margin-bottom: 18px; background: #fff8f8; }
        .error-card.FATAL { border-left-color: #8e44ad; background: #fdf5ff; }
        .error-card.WARN  { border-left-color: #f39c12; background: #fffbf0; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #fff; background: #e74c3c; margin-bottom: 8px; }
        .badge.FATAL { background: #8e44ad; }
        .badge.WARN  { background: #f39c12; }
        .label { font-weight: 600; color: #333; font-size: 13px; }
        .value { color: #555; font-size: 13px; margin-bottom: 6px; }
        .root-cause { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 8px 12px; font-size: 13px; color: #856404; margin: 8px 0; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 4px; font-size: 11px; overflow-x: auto; max-height: 200px; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚨 Log Error Alert</h1>
    <div class="meta">
        <strong>File:</strong> <span th:text="${report.logFilePath}"></span> &nbsp;|&nbsp;
        <strong>Scanned At:</strong> <span th:text="${report.scannedAt}"></span> &nbsp;|&nbsp;
        <strong>Total Errors:</strong> <span th:text="${report.totalErrors}"></span>
    </div>

    <div th:each="err : ${report.errors}">
        <div class="error-card" th:classappend="${err.severity}">
            <span class="badge" th:classappend="${err.severity}" th:text="${err.severity}"></span>
            &nbsp;
            <span style="font-weight:600; font-size:14px;" th:text="${err.errorType}"></span>
            <span style="color:#999; font-size:12px;"> — Line <span th:text="${err.lineNumber}"></span></span>

            <div class="value" th:text="${err.errorMessage}"></div>

            <div class="root-cause">
                🔍 <strong>Root Cause:</strong> <span th:text="${err.rootCause}"></span>
            </div>

            <div th:if="${!err.stackTrace.isEmpty()}">
                <pre><span th:each="st : ${err.stackTrace}" th:text="${st + '\n'}"></span></pre>
            </div>
        </div>
    </div>

    <div class="footer">Generated by Log Scanner Service · Spring Boot 3.4 · JDK 21</div>
</div>
</body>
</html>
